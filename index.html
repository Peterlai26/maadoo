<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F7FF; --surface:#FFFFFF; --surface-2:#E4F0FD; --ink:#1B2E57; --ink-2:#4A5E88; --ink-3:#8494B6;
  --line:#D5E3F6; --accent:#FFC53D; --accent-ink:#0D3C94; --blue:#2F6FD6; --blue-ink:#FFFFFF; --navy:#0D3C94;
  --sky:#CFEAFF; --sky-2:#EAF5FF; --orange:#FF9A1F; --orange-ink:#FFFFFF; --orange-soft:#FFE7C7; --blush:#FFB9B3;
  --good:#1C9D7F; --good-bg:#DCF5EC; --mid:#C27A12; --mid-bg:#FFF1D3; --bad:#E0506A; --bad-bg:#FFE3E8;
  --shadow:0 2px 0 rgba(13,60,148,.06),0 10px 24px rgba(47,111,214,.10);
  --star:#FFB800; --plus-a:#4F86FF; --plus-b:#9161F5; --plus-c:#F2689F; --plus-soft:#F1EAFF; --plus-ink:#5B34C9; --coin-a:#FFD45C; --coin-b:#FF9A1F; --coin-ink:#4A2800; --on-brand:#FFFFFF; --cream:#FFF7E3; --cream-line:#F3DFA8; --orange-btn:#FF8A1F; --orange-btn-shade:#D96A00; --tag:#FF9A1F; --tag-shade:#D97A08; --tag-ink:#FFFFFF; --logo-bg:transparent; --logo-ink:#0D3C94;
  --display:"Mali",system-ui,sans-serif; --body:"Anuphan",system-ui,sans-serif; --mono:"Anuphan",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0C1630;--surface:#132248;--surface-2:#1B2D5A;--ink:#EAF1FF;--ink-2:#B1C2E4;--ink-3:#8292B8;
  --line:#26396B;--accent:#FFC94D;--accent-ink:#0D2A66;--blue:#5B93F5;--blue-ink:#08162F;--navy:#A9C8FF;--sky:#1A3470;--sky-2:#15285A;--orange:#FFA940;--orange-ink:#2A1600;--orange-soft:#4A3312;--blush:#F59C95;
  --good:#4CCBAA;--good-bg:#153B35;--mid:#EAB04E;--mid-bg:#3A2E14;--bad:#F57A90;--bad-bg:#40202B;
  --shadow:0 2px 0 rgba(0,0,0,.2),0 10px 24px rgba(0,0,0,.3);--logo-bg:#EAF3FF;--logo-ink:#A9C8FF;--plus-soft:#2C2358;--plus-ink:#C9B5FF;--cream:#3A3120;--cream-line:#5C4B26;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0C1630;--surface:#132248;--surface-2:#1B2D5A;--ink:#EAF1FF;--ink-2:#B1C2E4;--ink-3:#8292B8;
  --line:#26396B;--accent:#FFC94D;--accent-ink:#0D2A66;--blue:#5B93F5;--blue-ink:#08162F;--navy:#A9C8FF;--sky:#1A3470;--sky-2:#15285A;--orange:#FFA940;--orange-ink:#2A1600;--orange-soft:#4A3312;--blush:#F59C95;
  --good:#4CCBAA;--good-bg:#153B35;--mid:#EAB04E;--mid-bg:#3A2E14;--bad:#F57A90;--bad-bg:#40202B;
  --shadow:0 2px 0 rgba(0,0,0,.2),0 10px 24px rgba(0,0,0,.3);--logo-bg:#EAF3FF;--logo-ink:#A9C8FF;--plus-soft:#2C2358;--plus-ink:#C9B5FF;--cream:#3A3120;--cream-line:#5C4B26;}
*{box-sizing:border-box}
body{overscroll-behavior-x:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 100px;
  background-image:radial-gradient(circle at 12% 0%,var(--sky-2) 0,transparent 40%),radial-gradient(circle at 100% 30%,var(--sky-2) 0,transparent 35%)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance;color:var(--navy)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:1040px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:24px;font-weight:700;color:var(--navy);background:none;border:0;padding:0;letter-spacing:.02em}
.logo img{width:44px;height:44px;border-radius:50%;transition:transform .3s}
.logo:hover img{transform:rotate(-8deg) scale(1.06)}
.demo-tag{font-size:11px;color:var(--ink-2);background:var(--surface);border:1.5px dashed var(--line);padding:2px 10px;border-radius:99px}
.topnav{margin-left:auto;display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:99px;border:1.5px solid var(--line)}
.topnav button{background:none;border:0;padding:7px 14px;border-radius:99px;color:var(--ink-2);font-weight:500}
.topnav button.on{background:var(--blue);color:var(--blue-ink)}
@media(max-width:760px){.topnav{display:none}}

/* bottom nav (phone) */
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);display:none;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(47,111,214,.08)}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px 6px;min-width:56px;border-radius:14px}
.bnav button.on{color:var(--blue);font-weight:600}
.bnav button.on svg{stroke:var(--blue)}
.bnav svg{width:22px;height:22px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav .write{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:8px 14px;transform:translateY(-14px);box-shadow:0 6px 16px rgba(255,197,61,.5);font-weight:600}
.bnav .write.on{color:var(--accent-ink)}
.bnav .write svg,.bnav .write.on svg{stroke:var(--accent-ink)}
@media(max-width:760px){.bnav{display:flex}}

/* generic */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:20px}
.sec-h h2::before{content:"✦ ";color:var(--accent)}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;padding:0;font-size:14px;font-weight:500}
.btn{border:0;border-radius:99px;padding:11px 20px;font-weight:600;background:var(--blue);color:var(--blue-ink);box-shadow:0 3px 0 rgba(13,60,148,.25);transition:transform .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(13,60,148,.25)}
.btn.y{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 #D99A12}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.mid{background:var(--mid-bg);color:var(--mid)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ver{background:var(--good-bg);color:var(--good)}
.muted{color:var(--ink-3);font-size:13px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* hero */
.hero{background:linear-gradient(160deg,var(--sky),var(--sky-2));border:1.5px solid var(--line);border-radius:32px;padding:30px 28px;margin-top:6px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero-txt{display:grid;gap:16px;min-width:0;position:relative;z-index:1}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:700;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--blue);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:10px;background:var(--accent);opacity:.55;border-radius:99px;z-index:-1}
.hero p{color:var(--ink-2);max-width:48ch}
.mascot{position:relative;width:210px;height:210px;flex:none}
.mascot img{width:100%;height:100%;border-radius:50%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(13,60,148,.18))}
.m-say{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2;animation:bob 3.2s ease-in-out infinite}
.mascot img{position:relative;z-index:1}
.m-say path{fill:var(--surface);stroke:var(--navy);stroke-width:2.2;stroke-linejoin:round}
.m-say text{fill:var(--tag);stroke:var(--tag-shade);stroke-width:.5;paint-order:stroke;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:-.2px}
.spark{position:absolute;color:var(--accent);font-size:22px;animation:tw 2.4s ease-in-out infinite}
.spark.s1{top:-4px;left:6px}.spark.s2{top:24px;right:-8px;animation-delay:.8s;font-size:16px}.spark.s3{bottom:6px;left:-10px;animation-delay:1.4s;font-size:14px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:22px 18px}.mascot{width:96px;height:96px;position:absolute;right:14px;top:16px}.spark{display:none}.hero h1{max-width:none;padding-right:100px}}
.search{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:6px 6px 6px 16px;max-width:560px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;outline:none;color:var(--ink)}
.search .btn{padding:9px 18px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500}
.quick button:hover{border-color:var(--blue);color:var(--blue)}
.quick .explore-btn{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.quick .explore-btn:hover{color:var(--blue-ink)}
.explore-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.stats{display:flex;flex-wrap:wrap;gap:24px}
.stats b{font-family:var(--display);font-size:22px;color:var(--navy);display:block;line-height:1.1}
.stats span{font-size:12px;color:var(--ink-2)}

/* company card */
.co{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;transition:transform .15s,box-shadow .15s,border-color .15s}
.co:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--blue)}
.co-top{display:flex;gap:12px;align-items:center}
.mark{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;flex:none;color:#1B2E57}
.co-name{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.3;color:var(--navy)}
.score{margin-left:auto;text-align:right}
.score b{font-family:var(--display);font-size:22px;display:block;line-height:1}
.stars{color:var(--accent);letter-spacing:1px;font-size:12px}
.moodbar{display:flex;gap:3px;height:10px}
.moodbar i{display:block;height:100%;border-radius:99px}
.moodlegend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}

/* review */
.rv{display:grid;gap:8px}
.rv-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rv h3{font-size:16px}
.pc{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.pc dt{font-weight:600}.pc dt.p{color:var(--good)}.pc dt.c{color:var(--bad)}
.pc dd{margin:0;color:var(--ink-2)}
.help{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--ink-2)}
.help.on{background:var(--good-bg);color:var(--good);border-color:transparent}

/* company page */
.cp-head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;margin-top:8px}
.cp-head .mark{width:68px;height:68px;font-size:24px;border-radius:22px}
.cp-head h1{font-size:clamp(22px,4vw,30px)}
@media(max-width:600px){.cp-head{grid-template-columns:auto 1fr}.cp-head .actions{grid-column:1/-1}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-top:20px;overflow-x:auto;padding-bottom:2px}
.tabs button{background:var(--surface);border:1.5px solid var(--line);padding:8px 16px;color:var(--ink-2);font-weight:500;border-radius:99px;white-space:nowrap}
.tabs button.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px;font-size:14px}
.bar{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.ai{background:var(--sky-2);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px}
.ai-h{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--navy)}
.ai-h img{width:28px;height:28px;border-radius:50%}
.ai ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.rvp{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.rvp div{padding:10px 14px;font-size:14px;border-bottom:1.5px solid var(--line)}
.rvp div:nth-last-child(-n+2){border-bottom:0}
.rvp .hd{background:var(--surface-2);font-weight:600;font-size:13px}
.rvp div:nth-child(odd){border-right:1.5px solid var(--line)}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.meh{color:var(--mid);font-weight:600}
.lockwrap{position:relative}
.locked{filter:blur(5px);pointer-events:none;user-select:none}
.lock{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.lock .card{max-width:380px;text-align:center;display:grid;gap:10px;box-shadow:var(--shadow);justify-items:center}
.lock .card img{width:72px;height:72px;border-radius:50%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12px;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:10px;border-bottom:1.5px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.range{position:relative;height:10px;background:var(--surface-2);border-radius:99px;min-width:120px}
.range i{position:absolute;top:0;bottom:0;background:var(--blue);opacity:.3;border-radius:99px}
.range b{position:absolute;top:-3px;width:16px;height:16px;margin-left:-6px;background:var(--blue);border:3px solid var(--surface);border-radius:50%}
.scroll{overflow-x:auto}
.info{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-2);font-size:14px;margin-top:6px}

/* form */
.form{display:grid;gap:22px;max-width:640px}
.q{display:grid;gap:10px}
.q label.t{font-family:var(--display);font-weight:600;font-size:17px;color:var(--navy)}
.q .step{font-size:12px;color:var(--blue);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;font-weight:500}
.opt:hover{border-color:var(--blue)}
.opt.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.starsel button{background:none;border:0;font-size:34px;line-height:1;padding:0 2px;color:var(--line);transition:transform .12s}
.starsel button:hover{transform:scale(1.15)}
.starsel button.on{color:var(--accent)}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px}
textarea.field{min-height:84px;resize:vertical}
.progress{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.fhead{display:flex;gap:14px;align-items:center}
.fhead img{width:64px;height:64px;border-radius:50%}

/* share card */
.share{background:linear-gradient(160deg,#CFEAFF,#F3F9FF);color:#1B2E57;border:2px solid #A9CFF5;border-radius:26px;padding:22px;display:grid;gap:8px;max-width:380px;position:relative;overflow:hidden}
.share .big{font-family:"Mali",sans-serif;font-weight:700;font-size:54px;color:#2F6FD6;line-height:1.05}
.share .brand{display:flex;align-items:center;gap:6px;font-family:"Mali",sans-serif;font-weight:700;color:#0D3C94}
.share .brand img{width:28px;height:28px;border-radius:50%}
.share small{color:#4A5E88}
.share .pup{position:absolute;right:-18px;bottom:-18px;width:120px;height:120px;border-radius:50%;opacity:.95}
.share > *:not(.pup){position:relative;z-index:1;max-width:calc(100% - 70px)}
.share .brand,.share .big{max-width:none}

/* poll */
.poll{display:grid;gap:8px}
.pollopt{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;text-align:left;overflow:hidden;font-weight:500}
.pollopt .fill{position:absolute;inset:0 auto 0 0;background:var(--sky);z-index:0;transition:width .5s}
.pollopt span{position:relative;z-index:1;display:flex;justify-content:space-between}
.pollopt.mine{border-color:var(--blue)}

/* qa */
.thread{display:grid;gap:10px}
.ans{border-left:4px solid var(--sky);padding-left:12px;display:grid;gap:4px;font-size:14px;border-radius:2px}
.badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--mid-bg);color:var(--mid)}

/* email code login (OTP): step 1 send code → step 2 verify code */
const OTP_WAIT=60,OTP_RE=/^\d{6,8}$/;let otpTimer=null;
function otpErr(e,ctx){
 const c=String((e&&e.code)||''),m=String((e&&e.message)||'').toLowerCase(),st=e&&e.status;
 if(st===429||c.startsWith('over_')||m.includes('rate limit'))return ctx==='send'?['ส่งโค้ดบ่อยเกินไป รอสักครู่แล้วลองใหม่นะ','You’ve asked for codes too often. Wait a moment and try again.']:['ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่นะ','Too many tries. Wait a moment and try again.'];
 if(ctx==='verify'&&(c==='otp_expired'||c==='otp_disabled'||m.includes('expired')||m.includes('invalid')||st===403||st===401))return ['โค้ดไม่ถูกต้องหรือหมดอายุแล้ว เช็กตัวเลขอีกครั้ง หรือกด “ส่งโค้ดใหม่”','That code is wrong or has expired. Check the numbers, or tap “Send a new code”.'];
 return authErr(e,'email');
}

   <small class="muted" id="ocode-hint" style="margin-top:-6px">${t('โค้ดเป็นตัวเลข 6–8 หลัก · ไม่เจออีเมล? ลองดูในสแปมหรือโปรโมชัน','The code is 6–8 digits · Can’t find the email? Check spam or promotions.')}</small>

const otpLeft=()=>{const m=S.modal;return m&&m.until?Math.max(0,Math.ceil((m.until-Date.now())/1000)):0};
const otpResendTxt=n=>n>0?t(`ส่งโค้ดใหม่ได้ใน ${n} วิ`,`Send a new code in ${n}s`):t('ส่งโค้ดใหม่','Send a new code');
function otpTick(){
 clearInterval(otpTimer);otpTimer=null;const m=S.modal;if(!m||m.type!=='otp'||m.step!=='code'||otpLeft()<=0)return;
 otpTimer=setInterval(()=>{const b=document.getElementById('otpResend'),n=otpLeft();
  if(!S.modal||S.modal.type!=='otp'||S.modal.step!=='code'||!b){clearInterval(otpTimer);otpTimer=null;return}
  b.textContent=otpResendTxt(n);if(n<=0){if(!S.modal.busy)b.disabled=false;clearInterval(otpTimer);otpTimer=null}},1000);
}
function keepOtp(){const m=S.modal;if(!m)return;const e=document.getElementById('oemail'),c=document.getElementById('ocode');if(e)m.email=e.value;if(c)m.code=c.value}

 m.busy=false;if(r&&r.error){m.err=otpErr(r.error,ctx);if(S.modal===m){renderModal();otpTick()}return null}
 if(S.modal===m){renderModal();otpTick()}return r||{};

function otpSend(){
 keepOtp();const m=S.modal;if(!m||m.type!=='otp')return;const em=(m.email||'').trim();
 if(!EMAIL_RE.test(em)){m.err=ERR_EMAIL;renderModal();return}
 otpRun(()=>SB.auth.signInWithOtp({email:em,options:{data:{display_name:em.split('@')[0]}}}),'send')
  .then(r=>{if(!r||S.modal!==m)return;m.email=em;m.step='code';m.code='';m.until=Date.now()+OTP_WAIT*1000;renderModal();otpTick()});
}

 keepOtp();const m=S.modal;if(!m||m.type!=='otp')return;const code=(m.code||'').replace(/\D/g,'');

 // success: onAuthStateChange → SIGNED_IN closes this popup and says hi

 m.busy=false;
 if(!ok){m.err=err&&(err.status===429)?['ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่','Too many tries. Wait a moment and try again.']:err&&!err.status?['เชื่อมต่อไม่ได้ เช็กอินเทอร์เน็ตแล้วลองใหม่','Can’t connect. Check your internet and try again.']:['ลบรีวิวไม่สำเร็จ รีวิวนี้อาจถูกลบไปแล้ว ลองรีเฟรชหน้า','Couldn’t delete the review. It may already be gone. Try refreshing.'];if(S.modal===m)renderModal();return}
 S.myReviews=S.myReviews.filter(r=>r.id!==id);

function write(){
 if(S.done)return done();
 const f=S.form;const n=[f.co,f.r,f.mood!==null,f.ot!==null,f.rec!==null].filter(Boolean).length;
 const o=(k,v,l)=>`<button type="button" class="opt ${f[k]===v?'on':''}" data-f="${k}" data-v="${v}">${l}</button>`;
 return `<div class="fhead" style="margin-top:8px"><img src="${PUP()}" alt=""><div><h1 style="font-size:28px">${t('เขียนรีวิวสั้น','Quick review')}</h1><p class="muted">${t('5 ข้อ ไม่ถึง 1 นาที · ไม่แสดงชื่อ · วันที่แสดงเป็นไตรมาส','5 questions, under a minute · anonymous · dates shown by quarter')}</p></div></div>

   <div class="row"><input class="field" id="frole" maxlength="80" placeholder="${t('ตำแหน่ง (ไม่บังคับ)','Role (optional)')}" value="${esc(f.role)}" style="flex:1;min-width:180px"><div class="opts">${o('type','emp',x(TYPE.emp))}${o('type','intern',x(TYPE.intern))}</div></div></div>
  <div class="q"><span class="step">2/5</span><label class="t">${t('ให้คะแนนรวมกี่ดาว?','Overall rating')}</label><div class="starsel">${[1,2,3,4,5].map(i=>`<button type="button" class="${f.r>=i?'on':''}" data-star="${i}" aria-label="${i} ${t('ดาว','stars')}">★</button>`).join('')}</div></div>
  <div class="q"><span class="step">3/5</span><label class="t">${t('รู้สึกยังไงกับที่นี่?','How do you feel about it?')}</label><div class="opts">${MOODS.map((m,i)=>o('mood',i,m[0]+' '+x(m[1]))).join('')}</div></div>

async function addCoins(delta,kind,ref){const P=S.prem;
 if(ref&&claimed(ref))throw {message:'duplicate'};
 if(['mission','review'].includes(kind)&&missionEarned()+delta>MISSION_CAP)throw {message:'cap'};
 if(kind==='spend'&&P.coins+delta<0)throw {message:'not enough'};
 const status=kind==='review'?'pending':'ok';let id='l-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at=Date.now();
 if(sbLive()){P.rev++;const before=P.coins;await ensureProfile();const {data,error}=await SB.from('coin_ledger').insert({delta,kind,ref:ref||null}).select('id,created_at,status');if(error)throw error;if(!data||!data.length)throw {message:'ledger not saved'};id=data[0].id;at=Date.parse(data[0].created_at)||at;
  P.ledger.unshift({id,delta,kind,ref,status:data[0].status,at});await refreshCoins();P.rev++;
  if(data[0].status==='ok'&&P.coins!==before+delta)console.warn('[Maadoo Job] coin balance check: expected',before+delta,'got',P.coins)}
 else{P.ledger.unshift({id,delta,kind,ref,status,at});if(status==='ok')P.coins+=delta;
  else setTimeout(()=>{const l=P.ledger.find(v=>v.id===id);if(l&&l.status==='pending'){l.status='ok';P.coins+=l.delta;toast(t(`รีวิวผ่านการตรวจแล้ว (จำลอง) +${l.delta} เหรียญ`,`Review approved (simulated) +${l.delta} coins`));rerender()}},6000)}
 return id}

const REPLY={intern:[['ฝึกงานเลือกที่ที่ได้ลงมือจริงก่อนนะ ถามเขาเลยว่าเด็กฝึกงานได้ทำอะไรบ้างในแต่ละสัปดาห์','Pick an internship where you get hands-on work. Ask them what interns actually do each week.']],resume:[['เรซูเม่ให้ใส่ผลงานเป็นตัวเลข เช่น “ลดเวลาตรวจ 20%” แล้วตัดส่วนที่ไม่เกี่ยวกับงานออก','Put results as numbers, like “cut testing time by 20%”, and drop anything unrelated to the job.']],salary:[['ลองดูช่วงเงินเดือนในหน้าบริษัทก่อน แล้วขอสูงกว่าค่ากลางประมาณ 5–10% พร้อมเหตุผล','Check the salary range on the company page, then ask 5–10% above the median with a reason.']],switch:[['ย้ายสายได้ เริ่มจากทำโปรเจกต์เล็ก ๆ 1–2 ชิ้นให้มีของโชว์ก่อน','You can switch. Start with 1–2 small projects so you have something to show.']],rights:[['OT ต้องได้ค่าล่วงเวลา และลาป่วยได้ตามกฎหมาย ถ้าไม่แน่ใจให้ขอสัญญาจ้างมาอ่านก่อนเซ็น','Overtime must be paid and sick leave is your right. If unsure, ask to read the contract before signing.']]};

 ${S.indOpen&&!isSheet()?indMenu(false):''}</div>`}

function indFocus(i){const o=document.getElementById('indopt'+i)||document.querySelector('#indMenu .dd-opt');if(!o)return;o.focus({preventScroll:true});

   Real recordings later: put music/<theme>.mp3 in the repo and add the theme name to MUSIC_FILES; that file then loops instead. */
const MUSIC_FILES=[]; // e.g. ['sea','night'] once music/sea.mp3 and music/night.mp3 exist
const SNDINFO={default:['lo-fi คอร์ดเบา ๆ','Soft lo-fi chords'],night:['เปียโนช้า + จิ้งหรีด','Slow piano + crickets'],sakura:['สายลม + กระดิ่งลม','Breeze + wind chimes'],mint:['ลำธาร + มาริมบา','Brook + soft marimba'],lavender:['ambient pad นุ่ม ๆ','Soft ambient pad'],sunset:['กีตาร์อาร์เปจโจนุ่ม ๆ','Gentle guitar arpeggios'],dino:['กลองไม้ + เสียงป่า','Wood drums + jungle'],garden:['นกร้องในสวน','Garden birdsong'],sea:['คลื่น + นกนางนวล','Waves + seagulls']};
S.snd=store.get('maadoo-snd')==='1';
S.sndVol=(()=>{const v=parseFloat(store.get('maadoo-snd-vol'));return isFinite(v)?Math.min(1,Math.max(0,v)):.5})();
const SND=(()=>{
 const FADE=1.5,LOOK=.6,TICK=250;
 let ctx=null,master=null,white=null,brown=null,cur=null,skin=S.skin,timer=0,playing=false;
 const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],mtof=m=>440*Math.pow(2,(m-69)/12);
 const level=()=>S.sndVol*S.sndVol*.9;
 function ensure(){
  if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{ctx=new AC({latencyHint:'playback'})}catch(e){try{ctx=new AC()}catch(_){return false}}
  master=ctx.createGain();master.gain.value=level();const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
  const n=ctx.sampleRate*2;white=ctx.createBuffer(1,n,ctx.sampleRate);brown=ctx.createBuffer(1,n,ctx.sampleRate);
  const w=white.getChannelData(0),b=brown.getChannelData(0);let last=0;
  for(let i=0;i<n;i++){const r=Math.random()*2-1;w[i]=r;last=(last+.02*r)/1.02;b[i]=last*3.5}
  return true}
 /* building blocks (each scene gets its own output gain `o`) */
 function loop(buf){const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,rnd(0,1.9));return s}
 function filt(type,f,q){const x=ctx.createBiquadFilter();x.type=type;x.frequency.value=f;if(q!=null)x.Q.value=q;return x}
 function amp(v){const g=ctx.createGain();g.gain.value=v;return g}
 function pan(p){if(!ctx.createStereoPanner)return amp(1);const s=ctx.createStereoPanner();s.pan.value=p;return s}
 function lfo(param,rate,depth){const l=ctx.createOscillator(),g=amp(depth);l.frequency.value=rate;l.connect(g);g.connect(param);l.start();return l}
 function chain(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1]}
 function echo(dest,time,fb,wet){const i=amp(1),d=ctx.createDelay(2),f=amp(fb),lp=filt('lowpass',2200),w=amp(wet);d.delayTime.value=time;
  i.connect(dest);i.connect(d);chain(d,lp,f,d);d.connect(w);w.connect(dest);return i}
 function tone(dest,t,f,o){o=o||{};const s=ctx.createOscillator(),g=ctx.createGain(),a=o.a||.01,d=o.d||1,v=o.v||.05;
  s.type=o.type||'sine';s.frequency.setValueAtTime(f,t);if(o.to)s.frequency.exponentialRampToValueAtTime(o.to,t+(o.glide||d*.5));if(o.detune)s.detune.value=o.detune;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
  s.connect(g);g.connect(o.via?o.via(g):dest);s.start(t);s.stop(t+a+d+.05);return g}
 function burst(dest,t,d,v,f,type){const s=ctx.createBufferSource(),g=ctx.createGain(),x=filt(type||'bandpass',f,1.2);s.buffer=white;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);chain(s,x,g,dest);s.start(t,rnd(0,1.5));s.stop(t+d+.02)}
 function stream(min,max,fn){let n=0;return h=>{const now=ctx.currentTime;if(n<now-.1)n=now+rnd(.05,min);while(n<h){fn(n);n+=rnd(min,max)}}}
 function steady(step,fn){let n=0,i=0;return h=>{const now=ctx.currentTime;if(n<now-.1)n=now+.1;while(n<h){fn(n,i++);n+=step}}}
 /* one scene per theme: returns {tick(horizon), srcs:[continuous sources]} */
 const SCENES={
  default(o){const bus=echo(o,.38,.25,.18),lp=filt('lowpass',1300);lp.connect(bus);
   const hiss=chain(loop(white),filt('highpass',4000),amp(.004));hiss.connect(o);
   const prog=[[65,69,72,76],[64,67,71,74],[62,65,69,72],[60,64,67,71]];
   return {srcs:[hiss],tick:steady(4,(t,i)=>{const c=prog[i%4];
    c.forEach((m,j)=>{tone(lp,t+j*.035,mtof(m),{type:'triangle',v:.045,a:.03,d:3.7});tone(lp,t+j*.035,mtof(m),{v:.02,a:.05,d:3.5,detune:8})});
    tone(o,t,mtof(c[0]-24),{v:.1,a:.02,d:3.4});if(i%2)tone(lp,t+2,mtof(c[3]+12),{type:'triangle',v:.025,a:.02,d:1.6})})}},
  night(o){const bus=echo(o,.47,.32,.28);
   const cr=[[4400,-.4],[4750,.5]].map(([f,p])=>{const s=ctx.createOscillator(),g=amp(0);s.frequency.value=f;chain(s,g,pan(p),o);s.start();return {s,g}});
   const notes=[57,60,62,64,67,69,72,74,76];
   const piano=stream(1.3,2.8,t=>{const m=pick(notes);tone(bus,t,mtof(m),{v:.08,a:.006,d:3.4});tone(bus,t,mtof(m)*2,{v:.018,a:.004,d:1.2});
    if(Math.random()<.3){const m2=pick(notes);tone(bus,t+.18,mtof(m2),{v:.05,a:.006,d:3})}});
   const crick=cr.map(c=>stream(.7,1.6,t=>{const g=c.g.gain;for(let k=0;k<3;k++){const s=t+k*.07;g.setValueAtTime(0,s);g.linearRampToValueAtTime(.012,s+.012);g.linearRampToValueAtTime(0,s+.045)}}));
   return {srcs:cr.map(c=>c.s),tick:h=>{piano(h);crick.forEach(f=>f(h))}}},
  sakura(o){/* soft breeze: deep brown noise in slow gusts (no white-noise hiss, which reads as rain) + wind chimes */
   const w=loop(brown),bp=filt('bandpass',320,.9),lp=filt('lowpass',900),g=amp(.03);chain(w,bp,lp,g,o);
   const gusts=stream(5,9,t=>{const p=rnd(5,9),pk=rnd(.07,.11);g.gain.setValueAtTime(.025,t);g.gain.linearRampToValueAtTime(pk,t+p*.45);g.gain.linearRampToValueAtTime(.025,t+p*.95);
    bp.frequency.setValueAtTime(260,t);bp.frequency.linearRampToValueAtTime(rnd(480,640),t+p*.45);bp.frequency.linearRampToValueAtTime(260,t+p*.95)});
   const bus=echo(o,.33,.3,.3),chimes=[84,86,88,91,93,96,98];
   const ring=stream(.8,3.2,t=>{const n=Math.random()<.35?3:1;for(let k=0;k<n;k++){const f=mtof(pick(chimes)),s=t+k*rnd(.1,.25);
    tone(bus,s,f,{v:.04,a:.002,d:3.8});tone(bus,s,f*2.76,{v:.009,a:.002,d:1.3})}});
   return {srcs:[w],tick:h=>{gusts(h);ring(h)}}},
  mint(o){/* brook: low water rumble + pitched bubbling/gurgles + soft marimba (no broadband hiss) */
   const r=loop(brown),lp=filt('lowpass',380),rg=amp(.07);chain(r,lp,rg,o);const l=lfo(rg.gain,.13,.02);
   const gu=loop(brown),gf=filt('bandpass',700,4),gg=amp(.05);chain(gu,gf,gg,o);const l2=lfo(gf.frequency,.9,220),l3=lfo(gg.gain,.37,.03);
   const wp=pan(-.25);wp.connect(o);
   const bubbles=stream(.08,.5,t=>{const n=Math.random()<.4?2+Math.floor(Math.random()*3):1;for(let k=0;k<n;k++){const f=rnd(300,650),s=t+k*rnd(.04,.09);
    tone(wp,s,f,{v:.03,a:.003,d:.06,to:f*rnd(1.8,2.6),glide:.045})}});
   const bus=echo(o,.42,.25,.22),scale=[67,69,72,74,76,79,81];
   const mar=stream(2.2,4.5,t=>{const m=pick(scale);tone(bus,t,mtof(m),{v:.05,a:.004,d:1.4});tone(bus,t,mtof(m)*4,{v:.008,a:.002,d:.25});
    if(Math.random()<.4)tone(bus,t+.24,mtof(pick(scale)),{v:.035,a:.004,d:1.2})});
   return {srcs:[r,l,gu,l2,l3],tick:h=>{bubbles(h);mar(h)}}},
  lavender(o){const lp=filt('lowpass',900,.5);lp.connect(echo(o,.6,.35,.25));const l=lfo(lp.frequency,.05,350);
   const prog=[[57,60,64,67],[53,57,60,64],[55,59,62,67],[52,55,59,64]];
   return {srcs:[l],tick:steady(8,(t,i)=>{prog[i%4].forEach(m=>{[-7,7].forEach(dt=>{const s=ctx.createOscillator(),g=ctx.createGain();s.type='sawtooth';s.frequency.value=mtof(m);s.detune.value=dt;
     g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.018,t+3);g.gain.setValueAtTime(.018,t+7);g.gain.linearRampToValueAtTime(0,t+10.5);chain(s,g,lp);s.start(t);s.stop(t+10.6)})});
    tone(o,t+1,mtof(prog[i%4][2]+12),{v:.012,a:2.5,d:5})})}},
  sunset(o){const bus=echo(o,.36,.22,.2),prog=[[48,55,60,64,67],[45,52,57,60,64],[41,48,53,57,60],[43,50,55,59,62]],pat=[0,2,3,4,3,2,1,2];
   return {srcs:[],tick:steady(.36,(t,i)=>{const c=prog[Math.floor(i/16)%4],m=c[pat[i%8]],s=ctx.createOscillator(),g=ctx.createGain(),lp=filt('lowpass',3500,1);
    s.type='triangle';s.frequency.value=mtof(m);lp.frequency.setValueAtTime(3500,t);lp.frequency.exponentialRampToValueAtTime(700,t+.35);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(i%8?.06:.085,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+1.9);chain(s,lp,g,bus);s.start(t);s.stop(t+2);
    if(i%16===0)tone(o,t,mtof(c[0]-12),{v:.07,a:.01,d:2.8})})}},
  dino(o){const r=loop(brown),f=filt('lowpass',900),g=amp(.05);chain(r,f,g,o);const l=lfo(g.gain,.09,.025);
   const beat=[2,0,0,1,0,0,1,0,2,0,1,0,0,0,0,0];
   const drums=steady(.42,(t,i)=>{const b=beat[i%16];if(!b)return;const f0=b===2?150:220;
    tone(o,t,f0,{v:.13,a:.003,d:.32,to:f0*.55,glide:.12});burst(o,t,.03,.035,1800)});
   const calls=stream(3,8,t=>{if(Math.random()<.5){for(let k=0;k<2;k++){const s=t+k*.16;tone(o,s,170,{type:'square',v:.012,a:.005,d:.09,to:120,glide:.08,via:()=>{const x=filt('lowpass',650);x.connect(o);return x}})}}
    else{const f0=rnd(900,1400);[0,.22,.44].forEach((d,k)=>tone(o,t+d,f0*(1+k*.08),{v:.02,a:.01,d:.16,to:f0*.8,glide:.14}))}});
   return {srcs:[r,l],tick:h=>{drums(h);calls(h)}}},
  garden(o){const w=loop(white),bp=filt('bandpass',420,.7);chain(w,bp,amp(.03),o);
   const birds=[[2600,4000,-.5],[3200,5200,.45]].map(([lo,hi,p])=>{const out=pan(p);out.connect(o);
    return stream(1.6,5,t=>{const n=3+Math.floor(Math.random()*5),base=rnd(lo,hi);let s=t;for(let k=0;k<n;k++){const d=rnd(.05,.11),f=base*rnd(.85,1.15);tone(out,s,f,{v:.08,a:.008,d,to:f*rnd(.7,1.35),glide:d});s+=d+rnd(.03,.09)}})});
   return {srcs:[w],tick:h=>birds.forEach(b=>b(h))}},
  sea(o){const s=loop(brown),lp=filt('lowpass',500),g=amp(.03);chain(s,lp,g,o);const foam=loop(white),hp=filt('highpass',2500),fg=amp(.002);chain(foam,hp,fg,o);
   const waves=stream(6,10,t=>{const p=rnd(6,10);g.gain.setValueAtTime(.03,t);g.gain.linearRampToValueAtTime(.2,t+p*.4);g.gain.linearRampToValueAtTime(.03,t+p*.95);
    lp.frequency.setValueAtTime(420,t);lp.frequency.linearRampToValueAtTime(1100,t+p*.4);lp.frequency.linearRampToValueAtTime(420,t+p*.95);
    fg.gain.setValueAtTime(.002,t+p*.3);fg.gain.linearRampToValueAtTime(.012,t+p*.45);fg.gain.linearRampToValueAtTime(.002,t+p*.8)});
   const gp=pan(.3);gp.connect(o);
   const gulls=stream(7,15,t=>{const n=2+Math.floor(Math.random()*2);for(let k=0;k<n;k++){const f=rnd(1250,1500);tone(gp,t+k*.42,f,{type:'triangle',v:.02,a:.03,d:.32,to:f*.62,glide:.3})}});
   return {srcs:[s,foam],tick:h=>{waves(h);gulls(h)}}}
 };
 function make(k){const o=amp(0);o.connect(master);let sc;
  if(MUSIC_FILES.includes(k)){const el=new Audio('music/'+k+'.mp3');el.loop=true;el.preload='auto';const src=ctx.createMediaElementSource(el);src.connect(o);
   el.play().catch(()=>{});sc={srcs:[],tick:()=>{},el}}
  else sc=(SCENES[k]||SCENES.default)(o);
  sc.o=o;const t=ctx.currentTime;o.gain.setValueAtTime(0,t);o.gain.linearRampToValueAtTime(1,t+FADE);return sc}
 function kill(sc,fade){if(!sc)return;const t=ctx.currentTime;sc.o.gain.cancelScheduledValues(t);sc.o.gain.setValueAtTime(sc.o.gain.value,t);sc.o.gain.linearRampToValueAtTime(0,t+fade);
  setTimeout(()=>{sc.srcs.forEach(s=>{try{s.stop()}catch(e){}});if(sc.el){sc.el.pause();sc.el.removeAttribute('src');sc.el.load()}try{sc.o.disconnect()}catch(e){}},fade*1000+120)}
 function run(){clearInterval(timer);timer=0;if(!playing||document.hidden)return;const f=()=>{if(cur)cur.tick(ctx.currentTime+LOOK)};f();timer=setInterval(f,TICK)}
 function start(){if(playing||!ensure())return;playing=true;ctx.resume().catch(()=>{});master.gain.setValueAtTime(level(),ctx.currentTime);cur=make(skin);run()}
 function stop(){if(!playing)return;playing=false;clearInterval(timer);timer=0;const old=cur;cur=null;kill(old,.4);
  setTimeout(()=>{if(!playing&&ctx)ctx.suspend().catch(()=>{})},600)}
 function setSkin(k){if(k===skin)return;skin=k;if(!playing||!ctx)return;const old=cur;cur=make(k);kill(old,FADE);run()}
 function setVol(v){S.sndVol=v;store.set('maadoo-snd-vol',String(v));if(ctx)master.gain.setTargetAtTime(level(),ctx.currentTime,.05)}
 function toggle(){S.snd=!S.snd;store.set('maadoo-snd',S.snd?'1':'0');S.snd?start():stop()}
 document.addEventListener('visibilitychange',()=>{if(!ctx||!playing)return;
  if(document.hidden){clearInterval(timer);timer=0;if(cur&&cur.el)cur.el.pause();ctx.suspend().catch(()=>{})}
  else{ctx.resume().catch(()=>{});if(cur&&cur.el)cur.el.play().catch(()=>{});run()}});
 // remembered "on": wait for the visitor's first tap/click/key before making any sound (never autoplay)
 const wake=()=>{['click','keydown','touchend'].forEach(e=>document.removeEventListener(e,wake,true));if(S.snd&&!playing&&!document.hidden)start()};
 if(S.snd)['click','keydown','touchend'].forEach(e=>document.addEventListener(e,wake,true));
 return {setSkin,setVol,toggle,get playing(){return playing}};
})();

render();
setInterval(()=>{if(qTick())rerender()},60000);
setTimeout(loadPromoStats,SB?0:300);
if(!store.get('maadoo-welcome'))openModal({type:'welcome'});
if(window.supabase)initSB();else{const sbjs=document.getElementById('sbjs');if(sbjs)sbjs.addEventListener('load',initSB)}
</script>
